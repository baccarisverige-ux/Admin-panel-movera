name: Deploy Admin Panel to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Test and build the new admin
        working-directory: webapp
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          VITE_DATA: demo
        run: |
          npm ci
          npm test
          npx tsc -b
          npx vite build --base=/Admin-panel-movera/

      - name: Assemble the site (old root + new admin at /app/)
        run: |
          mkdir -p _site/legacy _site/app
          cp index.html app.js styles.css _site/legacy/
          cp -r webapp/dist/. _site/
          cp -r webapp/dist/. _site/app/
          cp _site/index.html _site/404.html
          echo "${GITHUB_SHA}" > _site/version.txt
          echo "${GITHUB_SHA}" > _site/app/version.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
